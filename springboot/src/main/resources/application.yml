
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/yi_dian_tong?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true


# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.springboot.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 服务器配置
server:
  port: 8080  # 后端服务端口

# JWT配置
jwt:
  secret: YiDianTongSecretKeyForJWTTokenGenerationAndValidation2025
  expiration: 604800000 # 7天(毫秒)

# 日志配置（开启安全调试日志）
logging:
  level:
    org.springframework.security: DEBUG
    com.example.springboot: DEBUG

# Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      # 本地 Redis 不需要密码
      password: ""
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms


# deepseek配置(wzm)
