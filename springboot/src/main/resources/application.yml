
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    # 本地数据库配置（用于演示）
    url: jdbc:mysql://localhost:3306/yi_dian_tong_2?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    # 云数据库配置（已注释，用于生产环境）
    #url: jdbc:mysql://120.46.206.75:3306/yi_dian_tong?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    # 数据库连接池优化（HikariCP）
    hikari:
      maximum-pool-size: 100           # 高并发：增加最大连接数到100
      minimum-idle: 20                 # 最小空闲连接数
      connection-timeout: 20000        # 连接超时时间（毫秒）
      idle-timeout: 300000             # 空闲连接超时时间（毫秒）
      max-lifetime: 1200000            # 连接最大生命周期（毫秒）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值（毫秒）
      validation-timeout: 5000         # 验证超时时间

  # MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.springboot.entity
  configuration:
    # 恢复控制台逐条 SQL 打印，便于排查问题
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 服务器配置
server:
  port: 8080  # 后端服务端口

# JWT配置
jwt:
  secret: YiDianTongSecretKeyForJWTTokenGenerationAndValidation2025
  expiration: 604800000 # 7天(毫秒)

# 日志配置（高并发优化）
logging:
  level:
    root: INFO
    # 高并发场景下的关键日志
    org.springframework.security: WARN  # 减少安全日志输出
    com.example.springboot: INFO        # 业务日志设为INFO，减少DEBUG输出
    # 数据库连接池监控
    com.zaxxer.hikari: WARN
    # Redis连接监控
    org.springframework.data.redis: WARN

# 高并发监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    metrics:
      enabled: true
    health:
      enabled: true
  metrics:
    export:
      jmx:
        enabled: true
    tags:
      application: yi-dian-tong

# Redis配置 - 高并发优化
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      lettuce:
        pool:
          max-active: 50   # 高并发：增加Redis连接数
          max-idle: 20
          min-idle: 10
          max-wait: 2000ms  # 等待超时时间


# deepseek配置(wzm)
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:sk-6803552ef4384e0aa49251069fd95bdd}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    timeout: 30000
# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}  # 从环境变量读取，或直接配置
  secret: ${WECHAT_SECRET:}  # 从环境变量读取，或直接配置
