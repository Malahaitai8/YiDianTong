spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ydt123456}
    url: jdbc:mysql://${DB_HOST:120.46.206.75}:${DB_PORT:3306}/${DB_NAME:yi_dian_tong}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    # 数据库连接池优化（HikariCP）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.springboot.entity
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# 服务器配置
server:
  port: 8080

# JWT配置
jwt:
  secret: ${JWT_SECRET:YiDianTongSecretKeyForJWTTokenGenerationAndValidation2025}
  expiration: 604800000 # 7天(毫秒)

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.springboot: INFO
  file:
    name: /app/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# DeepSeek配置
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:sk-6803552ef4384e0aa49251069fd95bdd}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    timeout: 30000

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

